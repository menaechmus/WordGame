const results = [];
const notes = [];

function test(name, body) {
  try {
    body();
    results.push({ name, ok: true });
  } catch (error) {
    results.push({ name, ok: false, error: error.message });
  }
}

function equal(actual, expected, label = 'value') {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${label}: expected ${e}, got ${a}`);
}

function throws(body, label) {
  try {
    body();
  } catch {
    return;
  }
  throw new Error(`${label}: expected an error`);
}

// Small seeded generator so the random games are the same on every run.
function seeded(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// "H8" -> 112
function square(name) {
  return at(Number(name.slice(1)) - 1, name.charCodeAt(0) - 65);
}

// Hands out tile numbers for letters, each number once. Lower case asks for
// a blank standing for that letter.
function tileSource() {
  const free = TILES.map((_, id) => id);
  return letter => {
    const wanted = letter === letter.toLowerCase() ? BLANK : letter;
    const i = free.findIndex(id => TILES[id] === wanted);
    if (i < 0) throw new Error(`no ${wanted} tile left`);
    return free.splice(i, 1)[0];
  };
}

// The tiles for `word` laid from square `from`, across or down, stepping
// over squares already filled (their letters must match).
function lay(board, take, word, from, across) {
  const step = across ? 1 : SIZE;
  const placements = [];
  let index = square(from);
  for (const letter of word) {
    if (board[index]) {
      if (board[index].letter !== letter.toUpperCase()) throw new Error(`${squareName(index)} holds ${board[index].letter}`);
    } else {
      placements.push({ index, id: take(letter), letter: letter.toUpperCase() });
    }
    index += step;
  }
  return placements;
}

// Writes letters straight onto a board, as if played earlier.
function preset(board, take, word, from, across) {
  for (const tile of lay(board, take, word, from, across)) board[tile.index] = { id: tile.id, letter: tile.letter };
  return board;
}

const errorOf = (board, placements) => evaluatePlay(board, placements, valid).error;

test('rules: the first play must cover the centre with two or more tiles', () => {
  const take = tileSource();
  equal(errorOf(emptyBoard(), []), 'Place some tiles first.', 'nothing');
  equal(errorOf(emptyBoard(), lay(emptyBoard(), take, 'CAT', 'A1', true)), 'The first word must cover the centre star.', 'off centre');
  equal(errorOf(emptyBoard(), lay(emptyBoard(), take, 'A', 'H8', true)), 'The first word needs at least two letters.', 'one tile');
});

test('rules: tiles in a line, no gaps, joined to the board', () => {
  const take = tileSource();
  const board = preset(emptyBoard(), take, 'CAT', 'G8', true);
  const bent = [...lay(board, take, 'A', 'G9', true), ...lay(board, take, 'T', 'H10', true)];
  equal(errorOf(board, bent), 'Tiles must go in one row or one column.', 'bent');
  const gappy = [...lay(board, take, 'A', 'G9', true), ...lay(board, take, 'E', 'G11', true)];
  equal(errorOf(board, gappy), 'Leave no gaps between your tiles.', 'gap');
  equal(errorOf(board, lay(board, take, 'DOG', 'A1', true)), 'Your word must join the tiles already on the board.', 'apart');
  equal(errorOf(board, lay(board, take, 'S', 'A1', true)), 'Your word must join the tiles already on the board.', 'lone tile');
  equal(errorOf(board, [{ index: square('H8'), id: take('A'), letter: 'A' }]), 'That square is already taken.', 'taken');
});

// ---- Rules: scoring -----------------------------------------------------

const scoreOf = (board, placements, check = valid) => {
  const result = evaluatePlay(board, placements, check);
  if (!result.ok) throw new Error(result.error);
  return result.score;
};

test('rules: first plays double on the centre star', () => {
  const first = (word, from, across) => scoreOf(emptyBoard(), lay(emptyBoard(), tileSource(), word, from, across));
  equal(first('CAT', 'G8', true), 10, 'CAT');
  equal(first('QUIZ', 'H8', false), 44, 'QUIZ down');
  equal(first('ZEBRA', 'D8', true), 52, 'ZEBRA, Z on a double letter');
});

  const take = tileSource();
  const result = evaluatePlay(emptyBoard(), lay(emptyBoard(), take, 'JOURNEY', 'H8', true), valid);
  equal([result.ok, result.bingo, result.score], [true, true, 36 + BINGO], 'JOURNEY');

test('rules: a blank scores nothing', () => {

test('rules: premiums count once, under new tiles only', () => {

test('rules: a play alongside scores every word it makes', () => {

  const result = evaluatePlay(board, lay(board, take, 'AX', 'G9', true), valid);

});

test('rules: one tile that only makes a word downwards runs down', () => {

});

test('rules: two word premiums multiply (x4 and x9)', () => {
  let take = tileSource();
  const row4 = preset(emptyBoard(), take, 'AAAAAAA', 'E4', true);
  equal(scoreOf(row4, lay(row4, take, 'AAAAAAAAA', 'D4', true), null), 36, 'double-double');

test('rules: wordCells stops at the edges of the board', () => {

});

// ---- Game ---------------------------------------------------------------

const two = [{ name: 'Ann' }, { name: 'Bob' }];

// Every tile is in exactly one place: the bag, a rack or the board.
function conserved(game) {
  const ids = [...game.bag, ...game.players.flatMap(p => p.rack), ...game.board.filter(Boolean).map(cell => cell.id)];
  equal([...ids].sort((a, b) => a - b), TILES.map((_, id) => id), 'every tile once');
}

// A game whose next player holds `letters` (lower case for blanks), with the
// rest of the tiles left in the bag.
function riggedGame(letters, players = two, seed = 1) {
  const game = newGame({ mode: 'local', players }, seeded(seed));
  const me = game.players[game.turn];
  game.bag.push(...me.rack);
  me.rack = [];
  for (const letter of letters) {
    const wanted = letter === letter.toLowerCase() ? BLANK : letter;
    const i = game.bag.findIndex(id => TILES[id] === wanted);
    me.rack.push(game.bag.splice(i, 1)[0]);
  }
  return game;
}

// Placements for `word` using the current player's own tiles.
function layFromRack(game, word, from, across) {
  const rack = [...game.players[game.turn].rack];
  const take = letter => {
    const wanted = letter === letter.toLowerCase() ? BLANK : letter;
    const i = rack.findIndex(id => TILES[id] === wanted);
    if (i < 0) throw new Error(`no ${wanted} on the rack`);
    return rack.splice(i, 1)[0];
  };
  return lay(game.board, take, word, from, across);
}

test('game: a new game deals seven tiles each and draws for first', () => {
  for (let seed = 1; seed <= 20; seed++) {
    const players = [{ name: 'A' }, { name: 'B' }, { name: 'C' }, { name: 'D' }].slice(0, 2 + (seed % 3));
    const game = newGame({ mode: 'local', players }, seeded(seed));
    equal(game.players.map(p => p.rack.length), players.map(() => RACK_SIZE), 'racks');
    equal(game.bag.length, 100 - RACK_SIZE * players.length, 'bag');
    conserved(game);
    const last = game.events[0].rounds.at(-1);
    const rank = draw => (TILES[draw.id] === BLANK ? '' : TILES[draw.id]);
    const best = last.map(rank).sort()[0];
    equal(last.filter(draw => rank(draw) === best).map(draw => draw.player), [game.first], `seed ${seed}: first player drew the best tile`);
    equal(game.turn, game.first, 'first to move');
  }
});

test('game: a play scores, refills the rack and passes the turn', () => {
  const game = riggedGame('QUIZERS');
  const me = game.turn;
  play(game, me, layFromRack(game, 'QUIZ', 'H8', false), valid);
  equal(game.players[me].score, 44, 'score');
  equal(game.players[me].rack.length, RACK_SIZE, 'rack refilled');
  equal(game.bag.length, 100 - 2 * RACK_SIZE - 4, 'bag');
  equal(game.turn, 1 - me, 'turn');
  equal(game.moves.at(-1), { player: me, type: 'play', name: 'H8', word: 'QUIZ', words: [{ text: 'QUIZ', score: 44 }], tiles: [112, 127, 142, 157], score: 44, bingo: false }, 'move');
  equal(game.events.map(event => event.type), ['play'], 'events');
  conserved(game);
});

test('game: illegal plays are refused and change nothing', () => {
  const game = riggedGame('QUIZERS');
  const me = game.turn;
  const before = JSON.stringify(game);
  throws(() => play(game, me, layFromRack(game, 'QUIZ', 'A1', true), valid), 'off centre');
  throws(() => play(game, me, layFromRack(game, 'ZQ', 'H8', true), valid), 'not a word');
  throws(() => play(game, 1 - me, layFromRack(game, 'QUIZ', 'H8', true), valid), 'wrong player');
  const foreign = game.bag.find(id => TILES[id] === 'E');
  throws(() => play(game, me, [{ index: CENTER, id: foreign, letter: 'E' }, ...layFromRack(game, 'S', 'I8', true)], valid), 'tile not on the rack');
  equal(JSON.stringify(game), before, 'unchanged');
});

test('game: a blank needs a letter', () => {
  const game = riggedGame('aTEN');
  const placements = layFromRack(game, 'aT', 'H8', true);
  throws(() => play(game, game.turn, placements.map(tile => ({ ...tile, letter: BLANK })), valid), 'no letter');
  play(game, game.turn, placements, valid);
  equal(game.board[CENTER].letter, 'A', 'blank shows A');
});

test('game: exchanging needs seven in the bag, keeps the rack full and scores nothing', () => {
  const game = newGame({ mode: 'local', players: two }, seeded(3));
  const me = game.turn;
  const old = game.players[me].rack.slice(0, 3);
  exchange(game, me, old, seeded(4));
  equal([game.players[me].rack.length, game.bag.length, game.scoreless, game.turn], [RACK_SIZE, 86, 1, 1 - me], 'after');
  if (old.some(id => game.players[me].rack.includes(id))) throw new Error('an old tile came straight back');
  conserved(game);
  game.bag.length = 6;
  equal(canExchange(game), false, 'six left');
  throws(() => exchange(game, game.turn, game.players[game.turn].rack.slice(0, 1)), 'six in the bag');
});

test('game: six scoreless turns between two end the game, racks counted against their owners', () => {
  const game = newGame({ mode: 'local', players: two }, seeded(5));
  for (let i = 0; i < 5; i++) pass(game, game.turn);
  equal(game.phase, 'play', 'five passes');
  pass(game, game.turn);
  equal(game.phase, 'over', 'six passes');
  const left = game.players.map(p => rackValue(p.rack));
  equal(game.players.map(p => p.score), left.map(points => -points), 'scores');
  equal(game.ending, { out: null, adjustments: left.map(points => -points) }, 'ending');
  equal(game.winners, left[0] === left[1] ? [0, 1] : [left[0] < left[1] ? 0 : 1], 'winners');
});

test('game: with three players it takes nine scoreless turns', () => {
  const game = newGame({ mode: 'local', players: [...two, { name: 'Cy' }] }, seeded(6));
  for (let i = 0; i < 8; i++) pass(game, game.turn);
  equal(game.phase, 'play', 'eight');
  pass(game, game.turn);
  equal(game.phase, 'over', 'nine');
});

test('game: going out takes the other racks', () => {
  const game = riggedGame('AT');
  const me = game.turn;
  const other = 1 - me;
  game.board[square('G8')] = { id: game.bag.splice(game.bag.findIndex(id => TILES[id] === 'C'), 1)[0], letter: 'C' };
  game.bag = [];
  game.players[other].score = 10;
  const theirs = rackValue(game.players[other].rack);
  play(game, me, layFromRack(game, 'CAT', 'G8', true), valid);
  equal(game.phase, 'over', 'over');
  equal(game.ending, { out: me, adjustments: me === 0 ? [theirs, -theirs] : [-theirs, theirs] }, 'ending');
  equal(game.players[me].score, 10 + theirs, 'went out (CAT doubled on the centre)');
  equal(game.players[other].score, 10 - theirs, 'stuck with tiles');
});

// ---- Moves --------------------------------------------------------------

const moveKey = tiles => tiles.map(t => `${t.index}${t.letter}${t.blank ? '*' : ''}`).sort().join(' ');

// Every way to lay some of the rack's tiles in a line, each judged by
// evaluatePlay: far too slow for the game, but simple enough to trust.
function bruteForce(board, rack, check) {
  const found = new Map();
  const sequences = [];
  const grow = (sequence, left) => {
    if (sequence.length) sequences.push(sequence);
    left.forEach((id, i) => {
      const rest = left.filter((_, j) => j !== i);
      const letters = TILES[id] === BLANK ? [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'] : [TILES[id]];
      for (const letter of letters) grow([...sequence, { id, letter, blank: TILES[id] === BLANK }], rest);
    });
  };
  grow([], rack);
  for (const across of [true, false]) {
    for (let start = 0; start < SIZE * SIZE; start++) {
      if (board[start]) continue;
      for (const sequence of sequences) {
        const placements = [];
        let index = start;
        for (const tile of sequence) {
          while (index !== null && board[index]) index = across ? (col(index) < SIZE - 1 ? index + 1 : null) : index < 210 ? index + SIZE : null;
          if (index === null) break;
          placements.push({ index, id: tile.id, letter: tile.letter, blank: tile.blank });
          index = across ? (col(index) < SIZE - 1 ? index + 1 : null) : index < 210 ? index + SIZE : null;
        }
        if (placements.length < sequence.length) continue;
        const result = evaluatePlay(board, placements, check);
        if (result.ok) found.set(moveKey(placements), result.score);
      }
    }
  }
  return found;
}

function sameMoves(board, letters) {
  const take = tileSource();
  const rack = [...letters].map(take);
  const generated = new Map(generateMoves(dict, board, rack).map(move => [moveKey(move.tiles), move.score]));
  const brute = bruteForce(board, rack, valid);
  const missing = [...brute.keys()].filter(key => !generated.has(key));
  const extra = [...generated.keys()].filter(key => !brute.has(key));
  const wrong = [...brute].filter(([key, score]) => generated.has(key) && generated.get(key) !== score);
  if (missing.length || extra.length || wrong.length) {
    throw new Error(`${letters}: missing ${missing.slice(0, 3)} | extra ${extra.slice(0, 3)} | wrong scores ${JSON.stringify(wrong.slice(0, 3))}`);
  }
  return generated.size;
}

// A board with words running both ways, close to the edges and to each other.
function busyBoard() {
  const take = tileSource();
  const board = emptyBoard();
  preset(board, take, 'QUIZ', 'H8', false);
  preset(board, take, 'ZEBRA', 'H11', true);
  preset(board, take, 'OX', 'C5', true);
  preset(board, take, 'ATE', 'L11', false);
  preset(board, take, 'JIVE', 'A1', true);
  preset(board, take, 'NOT', 'O3', false);
  return board;
}

const words = { full: dict, common };

// A whole game between computer players, checking after every turn that
// each tile is in one place and the scores are the sum of the plays. Every
// play must pass game.play with the list the game is played with.
function playOut(levels, seed, lists = words) {
  const random = seeded(seed);
  const check = word => isWord(lists.full, word);
  const game = newGame({ mode: 'local', players: levels.map(level => ({ name: level, ai: true })) }, random);
  for (let turns = 0; game.phase === 'play'; turns++) {
    if (turns > 400) throw new Error('game did not finish');
    const seat = game.turn;
    const choice = think({ type: 'move', board: game.board, rack: game.players[seat].rack, bag: game.bag.length, level: levels[seat] }, lists, random);
    if (choice.type === 'play') play(game, seat, choice.tiles, check);
    else if (choice.type === 'exchange') exchange(game, seat, choice.ids, random);
    else pass(game, seat);
    conserved(game);
  }
  game.players.forEach((player, seat) => {
    const plays = game.moves.filter(move => move.player === seat).reduce((sum, move) => sum + (move.score ?? 0), 0);
    equal(player.score, plays + game.ending.adjustments[seat], `${player.name} seat ${seat} score`);
  });
  return game;
}

const wordList = (await Promise.all(['words/enable.txt', 'words/added.txt'].map(file => fetch(file).then(r => r.text()))))
  .flatMap(text => text.split('\n'))
  .map(line => line.trim().toUpperCase())
  .filter(word => /^[A-Z]{2,15}$/.test(word))
  .sort();

// The same questions answered the slow way, word by word through the list.
function fits(word, { starts = '', ends = '', contains = '', pattern = '', letters = '', length = 0 }) {
  const clean = (text, keep) => text.toUpperCase().replace(keep, '');
  [starts, ends, contains] = [starts, ends, contains].map(text => clean(text, /[^A-Z]/g));
  [pattern, letters] = [pattern, letters].map(text => clean(text, /[^A-Z?]/g));
  if (!word.startsWith(starts) || !word.endsWith(ends) || !word.includes(contains)) return false;
  if (length && word.length !== length) return false;
  if (pattern && (word.length !== pattern.length || [...pattern].some((ch, i) => ch !== '?' && ch !== word[i]))) return false;
  if (letters) {
    const pool = [...letters];
    for (const ch of word) {
      let i = pool.indexOf(ch);
      if (i < 0) i = pool.indexOf('?');
      if (i < 0) return false;
      pool.splice(i, 1);
    }
  }
  return true;
}

// A finished game with just what the statistics read. Each play is
// [seat, word, score, bingo]; scores are the players' finals.
function finished({ mode = 'ai', difficulty = 'hard', names = ['You', 'Computer'], scores, plays = [], swaps = [], hints = [] }) {
  const players = names.map((name, seat) => ({ name, ai: mode === 'ai' && seat === 1, score: scores[seat], hints: hints[seat] ?? 0 }));
  const best = Math.max(...scores);
  return {
    mode,
    difficulty,
    players,
    winners: scores.flatMap((score, seat) => (score === best ? [seat] : [])),
    moves: [
      ...plays.map(([player, word, score, bingo = false]) => ({ player, type: 'play', word, score, bingo })),
      ...swaps.map(player => ({ player, type: 'exchange', count: 3 })),
    ],
  };
}

// ---- Celebration (as in Cribbage) ---------------------------------------

const screens = [[390, 664], [844, 390], [1280, 720]];

// Runs a whole show in steps of a sixtieth of a second, calling look(show,
// bursts) after each step, and returns the show once it is over.
function runShow(width, height, look = () => {}) {
  const show = createShow(width, height, seeded(width));
  for (let step = 0; step < 60 * 20 && !isOver(show); step++) look(show, advance(show, 1 / 60));
  return show;
}

test('celebration: every firework bursts on screen, in the upper half', () => {

        if (rocket.x < 0.05 * width || rocket.x > 0.95 * width || rocket.to < 0.08 * height || rocket.to > 0.5 * height) {
          throw new Error(`${width}x${height}: a burst at ${rocket.x.toFixed(0)}, ${rocket.to.toFixed(0)}`);
        }
      }
    });
  }
});

});

test('celebration: each rocket bursts exactly once', () => {

    equal([bursts, show.rockets.every(rocket => rocket.burst)], [show.rockets.length, true], `${width}x${height} bursts`);

// ---- Sound --------------------------------------------------------------

// Renders each effect into a buffer instead of the speakers. This cannot say
// whether it sounds good, only that it is there, bounded and not distorted.
// Effects are short, except the fanfare for a win and the ring of its hall.
// The tick is tried at its lowest and highest steps.
const LONGEST = { win: 4.5 };
for (const [name, step] of SOUNDS.flatMap(name => (name === 'tick' ? [[name, 0], [name, 14]] : [[name, 0]]))) {
  const label = `sound: ${name}${name === 'tick' ? ` (step ${step})` : ''} is audible, bounded and does not clip`;
  try {
    const rate = 44100;
    const context = new OfflineAudioContext(1, rate * 5, rate);
    renderSound(name, context, 0.05, step);
    const samples = (await context.startRendering()).getChannelData(0);
    let peak = 0;
    let end = 0;
    samples.forEach((sample, i) => {
      peak = Math.max(peak, Math.abs(sample));
      if (Math.abs(sample) > 0.002) end = i / rate;
    });
    notes.push(`sound ${name}${name === 'tick' ? ` ${step}` : ''}: peak ${peak.toFixed(2)}, ends at ${end.toFixed(2)} s`);
    if (peak < 0.05) throw new Error(`too quiet, peak ${peak.toFixed(3)}`);
    if (peak > 0.98) throw new Error(`would clip, peak ${peak.toFixed(2)}`);
    if (end > (LONGEST[name] ?? 1.3)) throw new Error(`still sounding after ${end.toFixed(2)} s`);
    results.push({ name: label, ok: true });
  } catch (error) {
    results.push({ name: label, ok: false, error: error.message });
  }
}

// ---- Report -------------------------------------------------------------

const failed = results.filter(r => !r.ok);
const summary = `${failed.length ? 'FAILED' : 'PASSED'} ${results.length - failed.length}/${results.length}`;
document.title = summary;
const heading = document.getElementById('summary');
heading.textContent = summary;
heading.className = failed.length ? 'fail' : 'pass';
document.getElementById('out').textContent = [
  ...results.map(r => (r.ok ? `ok    ${r.name}` : `FAIL  ${r.name}\n      ${r.error}`)),
  '',
  ...notes,
].join('\n');
</script>
<script>
  // A module that fails to load never reaches the report above.
  addEventListener('error', event => {
    document.title = 'FAILED to run';
    document.getElementById('summary').textContent = `FAILED to run: ${event.message}`;
  });
  addEventListener('unhandledrejection', event => {
    document.title = 'FAILED to run';
    document.getElementById('summary').textContent = `FAILED to run: ${event.reason?.message ?? event.reason}`;
  });
</script>
</body>
</html>
